services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ace_user
      POSTGRES_PASSWORD: ace_password
      POSTGRES_DB: ace_platform
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  fastapi:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ace_user:ace_password@db:5432/ace_platform
      NODE_API_URL: http://node:3000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026}
    ports: ["8001:8001"]
    depends_on: [db]

  node:
    build: .
    environment:
      DATABASE_URL: postgresql://ace_user:ace_password@db:5432/ace_platform
      FASTAPI_URL: http://fastapi:8001
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026}
    ports: ["3000:3000"]
    depends_on: [fastapi, db]

volumes:
  pgdata:
