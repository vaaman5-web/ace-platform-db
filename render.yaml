# Render Blueprint — ACE Platform
#
# Live services (deployed via dashboard, matching this blueprint):
#   aceskills-api   Express API + LLM proxy      Node runtime,  https://https-ace-platform-backend.onrender.com
#   aceskills       FastAPI + TensorFlow/ML API  Docker backend/Dockerfile, https://aceskills.onrender.com
#
# NOTE: service names on the dashboard predate this blueprint; the envVar
# values below use the live URLs. If you re-apply the blueprint, adjust
# names/URLs or Render will attempt to create new services.

services:
  - type: web
    name: aceskills-api
    runtime: node
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://aceskills.vercel.app
      - key: FASTAPI_URL
        value: https://aceskills.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: aceskills-fastapi
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://aceskills.vercel.app,https://aceskills.onrender.com
      - key: NODE_API_URL
        value: https://https-ace-platform-backend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
